<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Planificador de Tareas</h1>

            <!--Formulario Agregar tarea-->
            <form id="taskForm" action="#" method="post" novalidate>
              <fieldset>
                <legend class="fs-5 mb-3">Nueva tarea</legend>
                <div class="mb-3">
                  <label for="taskName" class="form-label">Nombre</label>
                  <input type="text" id="taskName" name="taskName" class="form-control"
                    placeholder="Preparar informe" aria-describedby="taskNameHelp" required>
                  <div id="taskNameHelp" class="form-text">Más de 8 caracteres.</div>
                </div>

                <div class="mb-3">
                  <label for="taskDescription" class="form-label">Descripción</label>
                  <textarea id="taskDescription" name="taskDescription" class="form-control" rows="3"
                    placeholder="Resumir los resultados del sprint" aria-describedby="taskDescriptionHelp"
                    required></textarea>
                  <div id="taskDescriptionHelp" class="form-text">Más de 15 caracteres.</div>
                </div>

                <div class="mb-3">
                  <label for="assignedTo" class="form-label">Asignado a</label>
                  <input type="text" id="assignedTo" name="assignedTo" class="form-control"
                    placeholder="María" aria-describedby="assignedToHelp" required>
                  <div id="assignedToHelp" class="form-text">Más de 4 caracteres.</div>
                </div>
                <div class="mb-3">
                  <label for="targetDate" class="form-label">Fecha de entrega</label>
                  <input type="datetime-local" id="targetDate" name="targetDate" class="form-control"
                    aria-describedby="targetDateHelp" required>
                  <div id="targetDateHelp" class="form-text">Fecha y hora en que se debe completar la tarea.</div>
                </div>
                <div class="row g-3 mb-4">
                  <div class="col-12 col-sm-6">
                    <label for="taskStatus" class="form-label">Estado</label>
                    <select id="taskStatus" name="taskStatus" class="form-select" required>
                      <option value="" selected disabled>Selecciona un estado</option>
                      <option value="POR HACER">POR HACER</option>
                      <option value="EN PROCESO">EN PROCESO</option>
                      <option value="REVISIÓN">REVISIÓN</option>
                      <option value="HECHO">HECHO</option>
                    </select>
                  </div>

                  <div class="col-12 col-sm-6">
                    <label for="taskPriority" class="form-label">Prioridad</label>
                    <select id="taskPriority" name="taskPriority" class="form-select">
                      <option value="Urgente">Urgente</option>
                      <option value="Importante">Importante</option>
                      <option value="Media">Media</option>
                      <option value="Baja">Baja</option>
                    </select>
                  </div>
                </div>
              </fieldset>

              <div id="formErrors" class="alert alert-danger d-none" role="alert"></div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Agregar tarea</button>
              </div>
            </form>
          </div>
        </div>

        <section class="mt-5" aria-labelledby="tasksHeading">
          <h2 id="tasksHeading" class="h4 mb-3">Tareas</h2>

          <div id="taskList" class="vstack gap-3"></div>

          <p id="emptyTasksMessage" class="text-body-secondary text-center mb-0">Aún no hay tareas. Agrega la primera
            con el formulario.</p>
        </section>
      </div>
    </div>
  </main>
  <script src="./js/TaskManager.js" defer></script>
  <script src="./js/script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
